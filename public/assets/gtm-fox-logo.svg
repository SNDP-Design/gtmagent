<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Core Brand Gradients -->
    <linearGradient id="grad-lh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D5C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    
    <linearGradient id="grad-rh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="grad-le" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="grad-re" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <linearGradient id="grad-luc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <linearGradient id="grad-ruc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="grad-ls" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D5C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="grad-rs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- White Muzzle Gradients -->
    <linearGradient id="grad-lmo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="grad-rmo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="grad-lmi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="grad-rmi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Inner Ear Gradients -->
    <linearGradient id="grad-lie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="grad-rie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Nose Gradient -->
    <linearGradient id="grad-nose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
    </filter>
    <filter id="glow-md" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
    </filter>
  </defs>

  <style><![CDATA[
/* Motion and Animation */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    @keyframes pulse-glow {
      0%, 100% { transform: scale(0.97); opacity: 0.3; }
      50% { transform: scale(1.04); opacity: 0.7; }
    }
    
    @keyframes pulse-particle {
      0%, 100% { transform: scale(0.8); opacity: 0.2; }
      50% { transform: scale(1.3); opacity: 0.9; }
    }

    .fox-container {
      animation: float 6s ease-in-out infinite;
      transform-origin: 200px 200px;
    }

    .glow-outer {
      animation: pulse-glow 4s ease-in-out infinite;
      transform-origin: 200px 195px;
    }

    .glow-inner {
      animation: pulse-glow 4s ease-in-out infinite;
      animation-delay: 0.5s;
      transform-origin: 200px 195px;
    }

    .particle {
      animation: pulse-particle 4s ease-in-out infinite;
    }
    .p1 { animation-delay: 0.0s; transform-origin: 60px 100px; }
    .p2 { animation-delay: 1.2s; transform-origin: 340px 120px; }
    .p3 { animation-delay: 0.5s; transform-origin: 100px 300px; }
    .p4 { animation-delay: 2.1s; transform-origin: 300px 280px; }
    .p5 { animation-delay: 1.7s; transform-origin: 200px 60px; }
]]></style>

  <!-- Atmospheric Particles -->
  <g class="particles">
    <circle cx="60" cy="100" r="2" fill="#F97316" class="particle p1" />
    <circle cx="340" cy="120" r="3" fill="#EA580C" class="particle p2" />
    <circle cx="100" cy="300" r="1.5" fill="#92400E" class="particle p3" />
    <circle cx="300" cy="280" r="2" fill="#F97316" class="particle p4" />
    <circle cx="200" cy="60" r="2.5" fill="#EA580C" class="particle p5" />
    
    <!-- Subtle geometric floating accents -->
    <path d="M 30 150 L 34 144 L 38 150 L 34 156 Z" fill="#F97316" opacity="0.4" class="particle p3" />
    <path d="M 370 240 L 375 232 L 380 240 L 375 248 Z" fill="#EA580C" opacity="0.3" class="particle p1" />
  </g>

  <!-- Main Fox Illustration -->
  <g class="fox-container">
    
    <!-- Pulsing Glow Layers -->
    <path class="glow-outer" d="M 200 140 L 240 120 L 310 50 L 320 150 L 360 200 L 200 340 L 40 200 L 80 150 L 90 50 L 160 120 Z" filter="url(#glow-lg)" fill="#F97316" />
    <path class="glow-inner" d="M 200 140 L 240 120 L 310 50 L 320 150 L 360 200 L 200 340 L 40 200 L 80 150 L 90 50 L 160 120 Z" filter="url(#glow-md)" fill="#EA580C" />

    <!-- Anti-seam Base Silhouette -->
    <path d="M 200 140 L 240 120 L 310 50 L 320 150 L 360 200 L 200 340 L 40 200 L 80 150 L 90 50 L 160 120 Z" fill="#EA580C" />

    <!-- ================= GEOMETRIC FACETS ================= -->
    
    <!-- Outer Ears -->
    <path d="M 160 120 L 90 50 L 80 150 Z" fill="url(#grad-le)" />
    <path d="M 240 120 L 310 50 L 320 150 Z" fill="url(#grad-re)" />

    <!-- Inner Ears (White Accents) -->
    <path d="M 145 120 L 105 75 L 95 135 Z" fill="url(#grad-lie)" />
    <path d="M 255 120 L 295 75 L 305 135 Z" fill="url(#grad-rie)" />

    <!-- Top Head -->
    <path d="M 200 140 L 160 120 L 80 150 L 200 200 Z" fill="url(#grad-lh)" />
    <path d="M 200 140 L 240 120 L 320 150 L 200 200 Z" fill="url(#grad-rh)" />

    <!-- Upper Cheeks -->
    <path d="M 80 150 L 40 200 L 130 220 L 200 200 Z" fill="url(#grad-luc)" />
    <path d="M 320 150 L 360 200 L 270 220 L 200 200 Z" fill="url(#grad-ruc)" />

    <!-- Snout Bridge -->
    <path d="M 200 200 L 130 220 L 200 260 Z" fill="url(#grad-ls)" />
    <path d="M 200 200 L 270 220 L 200 260 Z" fill="url(#grad-rs)" />

    <!-- Lower Cheeks / Muzzle (White Accents) -->
    <path d="M 40 200 L 200 340 L 130 220 Z" fill="url(#grad-lmo)" />
    <path d="M 130 220 L 200 340 L 200 260 Z" fill="url(#grad-lmi)" />
    <path d="M 360 200 L 270 220 L 200 340 Z" fill="url(#grad-rmo)" />
    <path d="M 270 220 L 200 260 L 200 340 Z" fill="url(#grad-rmi)" />

    <!-- ================= DETAILS ================= -->

    <!-- Almond-Shaped Eyes (Dark Amber) -->
    <path d="M 95 165 L 145 180 L 125 185 Z" fill="#92400E" />
    <path d="M 305 165 L 255 180 L 275 185 Z" fill="#92400E" />

    <!-- Eye Highlights (Glowing Slits) -->
    <path d="M 105 169 L 135 178 L 125 181 Z" fill="#F97316" />
    <path d="M 295 169 L 265 178 L 275 181 Z" fill="#F97316" />

    <!-- Triangular Nose -->
    <path d="M 185 315 L 215 315 L 200 340 Z" fill="url(#grad-nose)" />
    
    <!-- Nose Highlight -->
    <path d="M 190 318 L 195 318 L 195 323 Z" fill="#FFFFFF" opacity="0.4" />

  </g>
</svg>